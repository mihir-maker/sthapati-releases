# Builds a Sthapati release from the private source, here because GitHub's build machines are free for a public repo, and
# publishes it in the private repo mihir-maker/sthapati-bin (BIN_TOKEN: contents read and write on that repo only), which
# sthapati.seaes.ai serves to firms with a code and to licensed apps. Nothing built is kept here: no release, no artifact but
# the encrypted log. The source is checked out with a read-only deploy key; the build's output is encrypted (LOG_KEY) so the
# public log shows only whether it worked.
#   gh workflow run build.yml -R mihir-maker/sthapati-releases -f tag=v0.9.0
name: Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "A version tag of the private repo, e.g. v0.9.0"
        required: true

permissions:
  contents: read

env:
  BIN: mihir-maker/sthapati-bin
  TAG: ${{ inputs.tag }}

jobs:
  # A draft first, so the files go up beside each other and the release is seen (by the updater too) only once whole.
  draft:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.BIN_TOKEN }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG isn't a version tag"; exit 1; }
          gh release view "$TAG" -R "$BIN" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$BIN" --draft --title "Sthapati $TAG" --notes "Sthapati $TAG for Windows and macOS."

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: pwsh -NoProfile -File packaging/ci/windows.ps1
          - os: macos-15
            script: bash packaging/ci/macos.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mihir-maker/sthapati
          ref: ${{ inputs.tag }}
          ssh-key: ${{ secrets.SOURCE_KEY }}
          persist-credentials: false
          path: src

      - name: Build (output encrypted)
        shell: bash
        working-directory: src
        env:
          STHAPATI_INVITE_URL: ${{ vars.INVITE_URL }}
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          if ${{ matrix.script }} > "$RUNNER_TEMP/build.log" 2>&1; then ok=1; else ok=0; fi
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY -in "$RUNNER_TEMP/build.log" -out "$RUNNER_TEMP/build.log.enc"
          rm -f "$RUNNER_TEMP/build.log"
          if [ "$ok" != 1 ]; then echo "::error::Build failed. Get the log: packaging/build-log.sh <run id>"; exit 1; fi
          ls dist/release

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-${{ matrix.os }}
          path: ${{ runner.temp }}/build.log.enc
          retention-days: 7

      - name: Upload to the private release
        shell: bash
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.BIN_TOKEN }}
        run: gh release upload "$TAG" -R "$BIN" --clobber dist/release/* > /dev/null

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The updater checks each file against the SHA-256 digest GitHub keeps for it; SHA256SUMS is its cross-check.
      - env:
          GH_TOKEN: ${{ secrets.BIN_TOKEN }}
        run: |
          mkdir dist && cd dist
          gh release download "$TAG" -R "$BIN" --pattern 'sthapati-*' > /dev/null
          sha256sum -- * > SHA256SUMS
          gh release upload "$TAG" -R "$BIN" --clobber SHA256SUMS > /dev/null
          gh release edit "$TAG" -R "$BIN" --draft=false --latest > /dev/null
          echo "published $(ls | wc -l) files"
